
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Bilge Baykuş ile Canlı Sohbet</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 22px 16px;
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .owl-container {
      width: min(250px, 65vw);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 4px solid #d4af37;
      border-radius: 50%;
      background: radial-gradient(circle, #45402c, #242424);
      box-shadow: 0 0 20px #d4af3760;
      transition: box-shadow .3s;
    }

    #owlImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #owlFallback {
      font-size: 120px;
    }

    .owl-container.active {
      box-shadow: 0 0 32px #d4af37;
    }

    .owl-container.active #owlImage,
    .owl-container.active #owlFallback {
      animation: talk .7s ease-in-out infinite alternate;
    }

    @keyframes talk {
      from { transform: scale(1); }
      to { transform: scale(1.045); }
    }

    h1 {
      color: #d4af37;
      font-size: 28px;
      margin: 12px 0;
    }

    #status {
      min-height: 48px;
      margin: 14px 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #transcript {
      background: #2a2a2a;
      padding: 15px;
      min-height: 60px;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 28px;
      background: #d4af37;
      color: #1a1a1a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #stopBtn {
      background: #555;
      color: white;
    }

    #testBtn {
      background: #345c8c;
      color: white;
    }

    .note {
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 22px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 24px; }
      button { padding: 11px 13px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
<main class="container">

  <div class="owl-container" id="owlContainer">
    <span id="owlFallback" role="img" aria-label="Baykuş">🦉</span>
    <img id="owlImage" alt="Bilge Baykuş">
  </div>

  <h1>Bilge Baykuş</h1>

  <div id="status" role="status" aria-live="polite">
    Merhaba dostum! Konuşmaya başlamak için düğmeye dokun.
  </div>

  <div id="transcript" aria-live="polite">
    <strong>Senin söylediğin:</strong> Henüz konuşmadın.
  </div>

  <div class="buttons">
    <button id="listenBtn" type="button">🎤 Konuşmaya Başla</button>
    <button id="stopBtn" type="button" disabled>⏹ Durdur</button>
    <button id="testBtn" type="button">🔊 Sesi Test Et</button>
  </div>

  <p class="note">
    Mikrofon izni gereklidir. Android'de güncel Google Chrome
    ve HTTPS bağlantısı kullan. Sesli yanıt için telefonun
    metin okuma motorunun etkin olması gerekir.
  </p>
</main>

<script>
"use strict";

const listenBtn = document.getElementById("listenBtn");
const stopBtn = document.getElementById("stopBtn");
const testBtn = document.getElementById("testBtn");
const statusDiv = document.getElementById("status");
const transcriptDiv = document.getElementById("transcript");
const owlImage = document.getElementById("owlImage");
const owlFallback = document.getElementById("owlFallback");
const owlContainer = document.getElementById("owlContainer");

const synth = "speechSynthesis" in window
  ? window.speechSynthesis
  : null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;
let isSpeaking = false;
let waitingForResponse = false;
let manuallyStopped = false;
let sessionId = 0;
let speechTimer = null;

// BAYKUŞ RESMİ
owlImage.onload = () => {
  owlImage.style.display = "block";
  owlFallback.style.display = "none";
};

owlImage.onerror = () => {
  owlImage.style.display = "none";
  owlFallback.style.display = "block";
};

owlImage.src = "baykus.png";

function setStatus(text) {
  statusDiv.textContent = text;
}

function updateButtons() {
  listenBtn.disabled =
    !recognition ||
    isListening ||
    isSpeaking ||
    waitingForResponse;

  stopBtn.disabled =
    !isListening && !isSpeaking && !waitingForResponse;
}

function clearSpeechTimer() {
  if (speechTimer !== null) {
    clearTimeout(speechTimer);
    speechTimer = null;
  }
}

function clearAvatar() {
  owlContainer.classList.remove("active");
}

// SES MOTORU
function getTurkishVoice() {
  if (!synth) return null;

  const voices = synth.getVoices();

  return voices.find(voice =>
    voice.lang &&
    voice.lang.toLowerCase().replace("_", "-").startsWith("tr")
  ) || null;
}

function speakResponse(text, mode = "reply") {
  if (!synth) {
    waitingForResponse = false;
    isSpeaking = false;
    updateButtons();
    setStatus("Bu tarayıcı sesli yanıtı desteklemiyor.");
    return;
  }

  clearSpeechTimer();

  // Önceki ses kuyruğunu temizle.
  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "tr-TR";
  utterance.rate = 0.9;
  utterance.pitch = 0.9;
  utterance.volume = 1;

  const voice = getTurkishVoice();

  if (voice) {
    utterance.voice = voice;
  }

  let completed = false;

  function finish(message) {
    if (completed) return;
    completed = true;

    clearSpeechTimer();
    isSpeaking = false;
    waitingForResponse = false;
    clearAvatar();
    updateButtons();

    if (message && !manuallyStopped) {
      setStatus(message);
    }
  }

  utterance.onstart = function () {
    clearSpeechTimer();

    isSpeaking = true;
    waitingForResponse = false;

    owlContainer.classList.add("active");
    updateButtons();

    setStatus(
      mode === "test"
        ? "Ses testi başladı."
        : "Bilge Baykuş: " + text
    );
  };

  utterance.onend = function () {
    finish(
      mode === "test"
        ? "Ses testi tamamlandı. Ses duyduysan sistem çalışıyor."
        : "Yanıtımı tamamladım dostum. Yeniden konuşabilirsin."
    );
  };

  utterance.onerror = function (event) {
    console.error("Seslendirme hatası:", event.error);

    finish(
      "Ses oluşturulamadı. Android metin okuma ayarlarını kontrol et."
    );
  };

  try {
    synth.cancel();
    synth.resume();
    synth.speak(utterance);

    // Ses hiç başlamazsa kullanıcıya açık hata ver.
    speechTimer = setTimeout(function () {
      if (!completed && !synth.speaking) {
        finish(
          "Ses başlamadı. Telefonun metin okuma motorunu kontrol et."
        );
      }
    }, 8000);

  } catch (error) {
    console.error("Ses başlatma hatası:", error);
    finish("Ses başlatılamadı. Sayfayı yenileyip tekrar dene.");
  }
}

// BAĞIMSIZ SES TESTİ
testBtn.addEventListener("click", function () {
  if (!synth) {
    setStatus("Tarayıcı sesli konuşmayı desteklemiyor.");
    return;
  }

  manuallyStopped = false;
  sessionId++;

  if (recognition && isListening) {
    try {
      recognition.abort();
    } catch (error) {
      console.warn(error);
    }
  }

  isListening = false;
  waitingForResponse = false;

  synth.cancel();
  updateButtons();

  speakResponse(
    "Merhaba dostum. Ben Bilge Baykuş. Sesim geliyorsa ses sistemi çalışıyor.",
    "test"
  );
});

// SES TANIMA
if (!SpeechRecognition) {
  listenBtn.disabled = true;
  setStatus(
    "Bu tarayıcı ses tanımayı desteklemiyor. Güncel Android Chrome kullan."
  );
} else {
  recognition = new SpeechRecognition();

  recognition.lang = "tr-TR";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function () {
    isListening = true;
    manuallyStopped = false;
    updateButtons();
    setStatus("Seni dinliyorum. Konuşabilirsin.");
  };

  recognition.onresult = async function (event) {
    const result = event.results[event.resultIndex];
    const userSpeech = result?.[0]?.transcript?.trim();

    if (!userSpeech) {
      setStatus("Seni anlayamadım. Tekrar deneyebilirsin.");
      return;
    }

    const currentSession = sessionId;

    transcriptDiv.textContent = "Senin söylediğin: " + userSpeech;

    waitingForResponse = true;
    updateButtons();
    setStatus("Bilge Baykuş düşünüyor...");

    try {
      const response = await generateOwlResponse(userSpeech);

      if (currentSession !== sessionId || manuallyStopped) return;

      speakResponse(response);
    } catch (error) {
      console.error("Yanıt hatası:", error);

      if (currentSession === sessionId) {
        waitingForResponse = false;
        updateButtons();
        setStatus("Yanıt hazırlanırken hata oluştu.");
      }
    }
  };

  recognition.onerror = function (event) {
    console.error("Mikrofon hatası:", event.error);

    const messages = {
      "not-allowed": "Mikrofon izni verilmemiş. Chrome ayarlarından izin ver.",
      "service-not-allowed": "Ses tanıma servisine erişilemiyor.",
      "no-speech": "Ses algılanamadı. Tekrar konuşmayı dene.",
      "audio-capture": "Mikrofon bulunamadı.",
      "network": "Ses tanıma sırasında ağ hatası oluştu.",
      "aborted": "Dinleme iptal edildi."
    };

    if (!manuallyStopped) {
      setStatus(
        messages[event.error] || "Ses tanıma hatası: " + event.error
      );
    }
  };

  recognition.onend = function () {
    isListening = false;
    updateButtons();

    if (!manuallyStopped &&
        !isSpeaking &&
        !waitingForResponse) {
      setStatus("Yeniden konuşmak için butona dokun.");
    }
  };

  listenBtn.addEventListener("click", function () {
    if (isListening || isSpeaking || waitingForResponse) return;

    sessionId++;
    manuallyStopped = false;

    if (synth) synth.cancel();
    clearSpeechTimer();
    clearAvatar();

    try {
      recognition.start();
    } catch (error) {
      console.error("Dinleme başlatma hatası:", error);
      setStatus("Dinleme başlatılamadı. Birkaç saniye sonra tekrar dene.");
    }
  });
}

// SOHBET YANITLARI
// Bu bölüm örnek cevaplar verir; gerçek bir yapay zekâ değildir.
async function generateOwlResponse(text) {
  const message = text.toLocaleLowerCase("tr-TR");

  if (message.includes("merhaba") || message.includes("selam")) {
    return "Selam dostum! Ben Bilge Baykuş. Bugün ne konuşalım?";
  }

  if (message.includes("nasılsın")) {
    return "İyiyim dostum. Seninle sohbet etmeye hazırım.";
  }

  if (message.includes("adın ne") || message.includes("kimsin")) {
    return "Ben Bilge Baykuş. Sorularına birlikte cevap arayabiliriz.";
  }

  if (message.includes("teşekkür") || message.includes("sağ ol")) {
    return "Rica ederim dostum. Yardımcı olabildiysem ne mutlu bana.";
  }

  if (message.includes("tarih") || message.includes("ekonomi") ||
      message.includes("kitap")) {
    return "Güzel bir konu seçtin dostum. Hangi ayrıntıyı merak ediyorsun?";
  }

  if (message.includes("görüşürüz") || message.includes("hoşça kal")) {
    return "Görüşmek üzere dostum. Yeni sorularınla yine beklerim.";
  }

  return "Seni duydum dostum. Şöyle söyledin: " + text +
    ". Bu konuda biraz daha ayrıntı verir misin?";
}

// ANDROID SES LİSTESİNİ YÜKLE
if (synth) {
  function loadVoices() {
    const voices = synth.getVoices();
    console.log("Yüklenen ses sayısı:", voices.length);

    const turkishVoice = getTurkishVoice();

    if (turkishVoice) {
      console.log("Türkçe ses:", turkishVoice.name);
    } else {
      console.log("Türkçe ses bulunamadı; varsayılan ses kullanılacak.");
    }
  }

  loadVoices();
  synth.addEventListener("voiceschanged", loadVoices);
}

// TÜM İŞLEMLERİ DURDUR
stopBtn.addEventListener("click", function () {
  sessionId++;
  manuallyStopped = true;

  clearSpeechTimer();

  if (recognition && isListening) {
    try {
      recognition.abort();
    } catch (error) {
      console.warn(error);
    }
  }

  if (synth) synth.cancel();

  isListening = false;
  isSpeaking = false;
  waitingForResponse = false;

  clearAvatar();
  updateButtons();

  setStatus("Sohbet durduruldu. Devam etmek için butona bas.");
});
</script>
</body>
</html>
