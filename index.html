
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Bilge Baykuş ile Canlı Sohbet</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background: #1a1a1a;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .owl-container {
      width: min(250px, 65vw);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 4px solid #d4af37;
      border-radius: 50%;
      background: radial-gradient(circle, #45402c, #242424);
      box-shadow: 0 0 20px #d4af3760;
      transition: box-shadow .3s ease;
    }

    #owlImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #owlFallback {
      font-size: clamp(90px, 25vw, 145px);
      line-height: 1;
      user-select: none;
    }

    .owl-container.active {
      box-shadow: 0 0 32px #d4af37;
    }

    .owl-container.active #owlImage,
    .owl-container.active #owlFallback {
      animation: owlTalk .7s ease-in-out infinite alternate;
    }

    @keyframes owlTalk {
      from { transform: scale(1); }
      to { transform: scale(1.045); }
    }

    h1 {
      color: #d4af37;
      font-size: 28px;
      margin: 12px 0;
    }

    #status {
      min-height: 48px;
      margin: 14px 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #transcript {
      background: #2a2a2a;
      padding: 15px;
      min-height: 60px;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 48px;
      padding: 12px 20px;
      border: 0;
      border-radius: 28px;
      background: #d4af37;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #stopBtn {
      background: #555;
      color: white;
    }

    .note {
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 22px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 24px; }
      button { padding: 11px 15px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="owl-container" id="owlContainer">
      <span id="owlFallback" role="img" aria-label="Bilge Baykuş">🦉</span>
      <img id="owlImage" alt="Bilge Baykuş">
    </div>

    <h1>Bilge Baykuş</h1>

    <div id="status" role="status" aria-live="polite">
      Sohbete başlamak için butona dokun.
    </div>

    <div id="transcript" aria-live="polite">
      <strong>Senin söylediğin:</strong> Henüz konuşmadın.
    </div>

    <div class="buttons">
      <button id="listenBtn" type="button">
        🎤 Konuşmaya Başla
      </button>
      <button id="stopBtn" type="button" disabled>
        ⏹ Durdur
      </button>
    </div>

    <p class="note">
      Mikrofon için izin vermelisin. En iyi sonuç için Android
      cihazında güncel Chrome ve HTTPS bağlantısı kullan.
      Bu sürüm örnek cevaplar verir; henüz gerçek bir yapay zekâya bağlı değildir.
    </p>
  </main>

  <script>
    "use strict";

    const listenBtn = document.getElementById("listenBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusDiv = document.getElementById("status");
    const transcriptDiv = document.getElementById("transcript");
    const owlImage = document.getElementById("owlImage");
    const owlFallback = document.getElementById("owlFallback");
    const owlContainer = document.getElementById("owlContainer");

    // Görseli yükle. Dosya yoksa baykuş simgesi görünür.
    owlImage.onload = function () {
      owlImage.style.display = "block";
      owlFallback.style.display = "none";
    };

    owlImage.onerror = function () {
      owlImage.style.display = "none";
      owlFallback.style.display = "block";
    };

    owlImage.src = "baykus.png";

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;
    let isSpeaking = false;
    let manuallyStopped = false;
    let waitingForResponse = false;
    let sessionId = 0;

    function setStatus(message) {
      statusDiv.textContent = message;
    }

    function updateButtons() {
      listenBtn.disabled =
        !SpeechRecognition ||
        isListening ||
        isSpeaking ||
        waitingForResponse;

      stopBtn.disabled =
        !isListening && !isSpeaking && !waitingForResponse;
    }

    function clearAvatarAnimation() {
      owlContainer.classList.remove("active");
    }

    if (!SpeechRecognition) {
      listenBtn.disabled = true;
      setStatus(
        "Bu tarayıcı ses tanımayı desteklemiyor. Android'de güncel Chrome deneyebilirsin."
      );
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = "tr-TR";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      listenBtn.addEventListener("click", startListening);
      stopBtn.addEventListener("click", stopEverything);

      recognition.onstart = function () {
        isListening = true;
        manuallyStopped = false;
        updateButtons();
        setStatus("Seni dinliyorum. Buyur, konuşabilirsin.");
      };

      recognition.onresult = async function (event) {
        const result = event.results[event.resultIndex];
        const userSpeech = result?.[0]?.transcript?.trim();

        if (!userSpeech) {
          setStatus("Seni anlayamadım. Tekrar deneyebilirsin.");
          return;
        }

        const thisSession = sessionId;

        transcriptDiv.textContent =
          "Senin söylediğin: " + userSpeech;

        waitingForResponse = true;
        updateButtons();
        setStatus("Düşünüyorum...");

        try {
          const response = await generateOwlResponse(userSpeech);

          if (thisSession !== sessionId || manuallyStopped) return;

          waitingForResponse = false;
          speakResponse(response);
        } catch (error) {
          console.error("Yanıt hatası:", error);

          if (thisSession === sessionId) {
            waitingForResponse = false;
            updateButtons();
            setStatus("Yanıt oluşturulurken hata oluştu.");
          }
        }
      };

      recognition.onerror = function (event) {
        console.error("Ses tanıma hatası:", event.error);

        const messages = {
          "not-allowed":
            "Mikrofon izni reddedildi. Tarayıcı ayarlarından mikrofon izni ver.",
          "service-not-allowed":
            "Tarayıcı ses tanıma servisine erişemiyor.",
          "no-speech":
            "Ses algılanamadı. Mikrofona daha yakından konuş.",
          "audio-capture":
            "Mikrofon bulunamadı veya kullanılamıyor.",
          "network":
            "Ses tanıma sırasında ağ hatası oluştu.",
          "aborted":
            "Dinleme iptal edildi."
        };

        if (!manuallyStopped) {
          setStatus(
            messages[event.error] ||
            "Ses tanıma hatası: " + event.error
          );
        }
      };

      recognition.onend = function () {
        isListening = false;
        updateButtons();

        if (manuallyStopped) return;

        if (!isSpeaking && !waitingForResponse) {
          setStatus("Yeni bir konuşma için butona dokun.");
        }
      };
    }

    function startListening() {
      if (!recognition || isListening || isSpeaking ||
          waitingForResponse) return;

      sessionId++;
      manuallyStopped = false;

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      clearAvatarAnimation();

      try {
        recognition.start();
      } catch (error) {
        console.error("Dinleme başlatılamadı:", error);
        setStatus(
          "Dinleme başlatılamadı. Birkaç saniye sonra tekrar dene."
        );
      }
    }

    function stopEverything() {
      sessionId++;
      manuallyStopped = true;
      waitingForResponse = false;

      if (recognition && isListening) {
        try {
          recognition.abort();
        } catch (error) {
          console.warn(error);
        }
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      isListening = false;
      isSpeaking = false;

      clearAvatarAnimation();
      updateButtons();

      setStatus("Sohbet durduruldu. Devam etmek için butona bas.");
    }

    async function generateOwlResponse(text) {
      const message = text.toLocaleLowerCase("tr-TR");

      if (message.includes("merhaba") || message.includes("selam")) {
        return "Selam olsun yolcu! Bugün hangi konuyu konuşacağız?";
      }

      if (message.includes("nasılsın")) {
        return "İyiyim dostum. Bilgi hazinemi paylaşmaya hazırım. Sen nasılsın?";
      }

      if (message.includes("ne yapıyorsun")) {
        return "Bilgi dünyasında yeni keşifler için seni bekliyorum.";
      }

      if (
        message.includes("kitap") ||
        message.includes("tarih") ||
        message.includes("ekonomi")
      ) {
        return "Güzel bir konu seçtin! Hangi ayrıntıyı merak ediyorsun? Birlikte inceleyelim.";
      }

      if (message.includes("adın ne") || message.includes("kimsin")) {
        return "Ben Bilge Baykuş! Soruların üzerine birlikte düşünmek için buradayım.";
      }

      if (
        message.includes("teşekkür") ||
        message.includes("sağ ol")
      ) {
        return "Rica ederim dostum. Bilgi paylaştıkça çoğalır.";
      }

      if (
        message.includes("görüşürüz") ||
        message.includes("hoşça kal")
      ) {
        return "Yolun açık olsun! Yeni sorularınla yine beklerim.";
      }

      return "Şöyle dedin: " + text +
        ". Bu konu hakkında biraz daha ayrıntı verir misin?";
    }

    function speakResponse(text) {
      if (!("speechSynthesis" in window)) {
        setStatus(text + " Tarayıcın sesli yanıtı desteklemiyor.");
        updateButtons();
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "tr-TR";
      utterance.pitch = 0.8;
      utterance.rate = 0.9;
      utterance.volume = 1;

      function selectTurkishVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(voice =>
          voice.lang && voice.lang.toLowerCase().startsWith("tr")
        );
      }

      const voice = selectTurkishVoice();
      if (voice) utterance.voice = voice;

      utterance.onstart = function () {
        isSpeaking = true;
        owlContainer.classList.add("active");
        updateButtons();
        setStatus(text);
      };

      utterance.onend = function () {
        isSpeaking = false;
        clearAvatarAnimation();
        updateButtons();

        if (!manuallyStopped) {
          setStatus("Yeni bir konuşma için butona dokun.");
        }
      };

      utterance.onerror = function (event) {
        isSpeaking = false;
        clearAvatarAnimation();
        updateButtons();

        if (!manuallyStopped) {
          console.error("Seslendirme hatası:", event.error);
          setStatus(text + " (Sesli yanıt verilemedi.)");
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = function () {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
